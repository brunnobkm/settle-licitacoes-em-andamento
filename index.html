<!doctype html>
<html lang="pt-BR" data-preview="kanban-licitacoes">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Licitações — Em andamento</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="styles.css?v=31" />
</head>
<body>
  <aside class="sidebar" aria-label="Sidebar">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="28" height="28">
        <circle cx="16" cy="16" r="14" fill="#D6EBDD"/>
        <path d="M22 9 C 14 9 8 14 8 21 C 8 22 9 23 10 23 C 17 23 22 17 22 9 Z" fill="#3D9B5C"/>
        <path d="M22 9 L 11 21" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      </svg>
    </div>

    <nav class="sb-nav">
      <button class="sb-btn" title="Recolher sidebar">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="14" height="12" rx="1.5"/><path d="M8 4v12"/></svg>
      </button>
      <button class="sb-btn" title="Início">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 10.5 10 4l7 6.5V16a1 1 0 0 1-1 1h-3v-4H8v4H4a1 1 0 0 1-1-1z" stroke-linejoin="round"/></svg>
      </button>
      <button class="sb-btn" title="Assistente">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3l1.5 3.5L15 8l-3.5 1.5L10 13l-1.5-3.5L5 8l3.5-1.5z" stroke-linejoin="round"/><path d="M15 13l.7 1.6L17 15l-1.3.7L15 17l-.7-1.3L13 15l1.3-.7z" stroke-linejoin="round"/></svg>
      </button>
      <button class="sb-btn" title="Notificações">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 14V9a5 5 0 0 1 10 0v5l1 1H4z" stroke-linejoin="round"/><path d="M8.5 17a1.5 1.5 0 0 0 3 0"/></svg>
      </button>

      <div class="sb-divider"></div>

      <button class="sb-btn" title="Caixa de entrada">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 12V5a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v7"/><path d="M3 12h4l1 2h4l1-2h4v3a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" stroke-linejoin="round"/></svg>
      </button>
      <button class="sb-btn sb-active" title="Licitações" aria-current="page">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="3" width="5" height="14" rx="1.2"/><rect x="8.5" y="3" width="5" height="9" rx="1.2"/><rect x="14" y="3" width="3" height="6" rx="1.2"/></svg>
      </button>
      <button class="sb-btn" title="Editais">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 3h7l3 3v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z" stroke-linejoin="round"/><path d="M12 3v3h3"/></svg>
      </button>
      <button class="sb-btn" title="Documentos">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="5" width="9" height="11" rx="1"/><path d="M7 3h9v11"/></svg>
      </button>
      <button class="sb-btn" title="Itens">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="4" y="4" width="12" height="3" rx="1"/><rect x="4" y="9" width="12" height="3" rx="1"/><rect x="4" y="14" width="12" height="3" rx="1"/></svg>
      </button>
      <button class="sb-btn" title="Análises">
        <svg viewBox="0 0 20 20" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="10" cy="10" r="6.5"/><path d="M10 3.5V10l4.6 2.6"/></svg>
      </button>
    </nav>

    <div class="sb-bottom">
      <div class="avatar" title="Brunno Krier">BK</div>
    </div>
  </aside>

  <header class="topbar">
    <div class="topbar-left">
      <button class="ghost-icon" title="Recolher sidebar">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="4" width="14" height="12" rx="1.5"/><path d="M8 4v12"/></svg>
      </button>
      <div class="crumbs">
        <span class="crumb">Licitações</span>
        <span class="crumb-sep">
          <svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 4l4 4-4 4"/></svg>
        </span>
        <span class="crumb crumb-current">Em andamento</span>
      </div>
    </div>
  </header>

  <section class="view-bar">
    <div class="view-tabs" role="tablist">
      <button class="view-tab active" role="tab" data-view="board" aria-selected="true">
        Board <span class="view-count" id="count-board">0</span>
      </button>
      <button class="view-tab" role="tab" data-view="table">
        Tabela <span class="view-count">0</span>
      </button>
      <button class="view-tab" role="tab" data-view="calendar">
        Calendário <span class="view-count">0</span>
      </button>
    </div>

    <div class="topbar-actions">
      <button class="action-btn-header">
        Filtrar
        <span class="badge">1</span>
      </button>
      <button class="action-btn-header">Ordenar</button>
      <button class="action-btn-header">Modo de visualização</button>
      <button class="action-btn-header">
        <svg viewBox="0 0 16 16" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="7.25" cy="7.25" r="4.5"/><path d="M10.75 10.75L14 14"/></svg>
        Buscar
      </button>
    </div>
  </section>

  <main class="board" id="board" aria-label="Board kanban"></main>
  <main class="calendar-view" id="calendar" hidden aria-label="Calendar"></main>
  <main class="table-view" id="tableView" hidden aria-label="Table"></main>

  <!-- Modal de "Em construção" — mostrado ao clicar no card (fora de propriedades) -->
  <div class="construction-modal" id="constructionModal" hidden role="dialog" aria-modal="true" aria-labelledby="constructionModalTitle">
    <div class="construction-modal-overlay" data-close></div>
    <div class="construction-modal-dialog">
      <header class="construction-modal-header">
        <span class="construction-modal-title" id="constructionModalTitle">Em construção</span>
        <button class="construction-modal-close" data-close aria-label="Fechar">
          <svg viewBox="0 0 20 20" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg>
        </button>
      </header>
      <div class="construction-modal-body">
        <p>Esta tela ainda está em construção.</p>
      </div>
      <footer class="construction-modal-footer">
        <button class="construction-modal-btn" data-close>Entendi</button>
      </footer>
    </div>
  </div>

  <!-- Detail panel: abre ao clicar num card, renderiza o card-fonte via iframe -->
  <div class="detail-overlay" id="detailOverlay" hidden></div>
  <aside class="detail-panel" id="detailPanel" hidden aria-label="Detalhe da licitação">
    <header class="detail-header">
      <div class="detail-crumb" id="detailCrumb">Licitação</div>
      <button class="detail-close" id="detailClose" aria-label="Fechar">
        <svg viewBox="0 0 20 20" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 5l10 10M15 5L5 15"/></svg>
      </button>
    </header>
    <iframe class="detail-iframe" id="detailIframe" title="Detalhe do card"></iframe>
  </aside>

  <script src="data.js?v=15"></script>
  <script src="app.js?v=34"></script>
</body>
</html>
